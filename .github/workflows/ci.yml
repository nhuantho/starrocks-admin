name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened, ready_for_review ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          backend/target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Lint frontend
      working-directory: frontend
      run: npm run lint

    - name: Check Rust formatting
      working-directory: backend
      run: cargo fmt -- --check

    - name: Run Clippy
      working-directory: backend
      run: cargo clippy --all-targets -- --deny warnings --allow clippy::uninlined-format-args

    - name: Run backend tests
      working-directory: backend
      run: cargo test --verbose

    - name: Generate test summary
      if: always()
      run: |
        echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Frontend linting passed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Rust formatting check passed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Clippy checks passed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Backend tests passed" >> $GITHUB_STEP_SUMMARY

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          backend/target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Build application
      run: make build

    - name: Verify build output
      run: |
        echo "Verifying build output..."
        
        # Check if binary exists
        if [ ! -f "build/dist/bin/starrocks-admin" ]; then
          echo "❌ Binary not found"
          exit 1
        fi
        
        # Check if binary is executable
        if [ ! -x "build/dist/bin/starrocks-admin" ]; then
          echo "❌ Binary is not executable"
          exit 1
        fi
        
        # Check required directories
        for dir in conf data logs migrations; do
          if [ ! -d "build/dist/$dir" ]; then
            echo "❌ Directory $dir not found"
            exit 1
          fi
        done
        
        echo "✅ Build verification passed"
        
        # Show build info
        ls -lh build/dist/bin/starrocks-admin
        du -sh build/dist/

    - name: Generate build summary
      run: |
        echo "## 🏗️ Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Status:** ✅ Build Successful" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Binary Size:** $(du -h build/dist/bin/starrocks-admin | cut -f1)" >> $GITHUB_STEP_SUMMARY
        echo "**Total Size:** $(du -sh build/dist/ | cut -f1)" >> $GITHUB_STEP_SUMMARY

  auto-merge:
    name: Auto-merge after CI
    needs: [ lint-and-test, build ]
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # No checkout or execution of PR code in this job with write permissions.
      - name: Merge the tested pull request
        uses: actions/github-script@v7
        with:
          script: |
            const tested = context.payload.pull_request;
            const { data: current } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: tested.number,
            });
            if (current.state !== 'open' || current.draft ||
                current.head.repo?.full_name !== context.payload.repository.full_name ||
                current.head.sha !== tested.head.sha ||
                current.base.ref !== tested.base.ref ||
                current.base.sha !== tested.base.sha) {
              core.notice('PR changed since CI started; run CI on the current revision before merging.');
              return;
            }
            const { data: result } = await github.rest.pulls.merge({
              ...context.repo,
              pull_number: current.number,
              sha: tested.head.sha,
              merge_method: 'merge',
            });
            if (!result.merged) {
              core.setFailed(result.message || 'GitHub did not merge the pull request.');
              return;
            }
            await core.summary.addHeading('Pull request merged')
              .addLink(`#${current.number}`, current.html_url)
              .addRaw('\nCI passed; no manual approval or merge click was needed.\n')
              .write();
