<div class="header-container">
  <div class="logo-container">
    <a (click)="toggleSidebar()" href="#" class="sidebar-toggle" aria-label="Toggle navigation">
      <nb-icon icon="menu-2-outline"></nb-icon>
    </a>
    <a class="logo modern-logo" href="#" (click)="navigateHome()">
      <span class="logo-icon" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="28" height="28" fill="none">
          <path d="M24 7H13a5 5 0 0 0 0 10h6a5 5 0 0 1 0 10H8M8 7v5m16 10v5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="logo-text">
        <span class="logo-main">Stellar</span>
        <span class="logo-sub">StarRocks &amp; Doris</span>
      </span>
    </a>
  </div>
  <!-- 主题切换器放在左边 -->
  <nb-select 
    [selected]="currentTheme" 
    (selectedChange)="changeTheme($event)" 
    status="basic" 
    size="small"
    class="theme-switcher"
    [placeholder]="'common.theme.placeholder' | translate">
    <nb-option *ngFor="let theme of themes" [value]="theme.value">{{ theme.name | translate }}</nb-option>
  </nb-select>
  <nb-select
    [selected]="currentLanguage"
    (selectedChange)="changeLanguage($event)"
    status="basic"
    size="small"
    class="language-switcher"
    [placeholder]="'common.language' | translate">
    <nb-option *ngFor="let lang of languages" [value]="lang.value">{{ lang.label }}</nb-option>
  </nb-select>
</div>

<div class="header-container">
  <nb-actions size="small">
    <nb-action class="user-action" *nbIsGranted="['view', 'user']">
      <nb-user [nbContextMenu]="userMenu"
               nbContextMenuTag="user-context-menu"
               [onlyPicture]="userPictureOnly"
               [name]="user?.name"
               [picture]="user?.picture">
      </nb-user>
    </nb-action>
  </nb-actions>
</div>
